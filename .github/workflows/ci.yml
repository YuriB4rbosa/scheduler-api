name: CI

on:
  push:
  pull_request:

# Cancela execuções antigas da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatação
        run: ruff format --check .

  test:
    name: Testes (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler -d scheduler_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scheduler:scheduler@localhost:5432/scheduler_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes com cobertura (falha abaixo de 80%)
        run: pytest
      - name: Resumo da cobertura
        if: always()
        run: |
          {
            echo "### Cobertura"
            python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"- Linhas: **{float(root.get('line-rate')) * 100:.1f}%**")
          print(f"- Ramos: **{float(root.get('branch-rate')) * 100:.1f}%**")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker (build e smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack (API + banco) e espera os healthchecks
        run: docker compose up -d --build --wait
      - name: Smoke test pela API
        run: |
          set -e
          API=http://localhost:8000
          curl -fsS "$API/health"
          curl -fsS -X POST "$API/api/v1/auth/register" -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","password":"senha-segura-123"}'
          TOKEN=$(curl -fsS -X POST "$API/api/v1/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"senha-segura-123"}' \
            | grep -o '"access_token": *"[^"]*"' | cut -d'"' -f4)
          test -n "$TOKEN"
          curl -fsS "$API/api/v1/auth/me" -H "Authorization: Bearer $TOKEN"
          curl -fsS -o /dev/null "$API/docs"
      - name: Seed dentro do container
        run: docker compose exec -T api flask seed
      - name: Recusa chaves de exemplo em produção
        run: |
          if APP_ENV=production docker compose run --rm --no-deps -e RUN_MIGRATIONS=0 api; then
            echo "A API subiu em produção com chaves de exemplo!" && exit 1
          fi
      - name: Logs da API (em caso de falha)
        if: failure()
        run: docker compose logs api
      - name: Derruba a stack
        if: always()
        run: docker compose down -v
